
<!DOCTYPE html>

<script>
// =============================
// 👥 + ⏰ CONTADOR DE ONLINE E TEMPO RESTANTE
// =============================

// seleciona o banner do topo
const banner = document.getElementById('banner');

// cria o contador visual (online + tempo)
const infoTopo = document.createElement("span");
infoTopo.style.cssText = `
  display:inline-block;
  margin-left:20px;
  color:#0ff;
  font-weight:bold;
  font-size:15px;
  transition: all 0.3s ease;
`;
banner.appendChild(infoTopo);

// estilo para piscar
const styleBlink = document.createElement("style");
styleBlink.textContent = `
@keyframes blinkOnline {
  0% { color: #00ff00; }
  50% { color: #fff; }
  100% { color: #00ff00; }
}`;
document.head.appendChild(styleBlink);

// chave única do contador (pode trocar para seu nome)
const siteKey = "iptvsite_online_2025";

// variáveis do tempo de uso
const LIMITE_MS = 60 * 60 * 1000; // 1 hora
let restanteMinutos = 60; // começa com 60

// função para atualizar o contador online
async function atualizarOnline() {
  try {
    const res = await fetch(`https://api.countapi.xyz/hit/${siteKey}/visitas`);
    const data = await res.json();
    const visitantes = data.value;

    atualizarDisplay(visitantes);
  } catch {
    atualizarDisplay(1);
  }
}

// função para atualizar texto e cor do topo
function atualizarDisplay(visitantes) {
  let cor = "#0ff";
  let animacao = "none";

  if (visitantes > 50) {
    cor = "#ff4040"; // vermelho (muitos)
    animacao = "blinkOnline 1s infinite";
  } else if (visitantes > 30) {
    cor = "#00ff00"; // verde piscando
    animacao = "blinkOnline 1s infinite";
  }

  infoTopo.style.color = cor;
  infoTopo.style.animation = animacao;

  infoTopo.textContent = `👥 ${visitantes} online | 🕒 Restante: ${restanteMinutos} min`;
}

// atualiza visitantes a cada 15 segundos
atualizarOnline();
setInterval(atualizarOnline, 15000);



// =============================
// ⏰ 2️⃣ BLOQUEIO DE 1 HORA POR DIA (SÓ PARA SENHA 2025)
// =============================
if (localStorage.getItem("iptv_password") === "2025") {
  const hoje = new Date().toLocaleDateString();
  const chave = "uso_diario_iptv";
  const dados = JSON.parse(localStorage.getItem(chave) || "{}");

  // zera se for novo dia
  if (dados.data !== hoje) {
    localStorage.setItem(chave, JSON.stringify({ data: hoje, tempo: 0 }));
  }

  let inicio = Date.now();
  let bloqueado = false;

  function atualizarTempoRestante() {
    const agora = Date.now();
    const dadosAtuais = JSON.parse(localStorage.getItem(chave));
    const totalHoje = (dadosAtuais.tempo || 0) + (agora - inicio);

    restanteMinutos = Math.max(0, Math.ceil((LIMITE_MS - totalHoje) / 60000));
    if (restanteMinutos <= 0 && !bloqueado) {
      bloqueado = true;
      localStorage.setItem(chave, JSON.stringify({ data: hoje, tempo: LIMITE_MS }));
      bloquearTela();
    }
  }

  setInterval(() => {
    atualizarTempoRestante();
    atualizarOnline(); // também atualiza o contador junto
  }, 15000);

  // salva tempo ao sair
  window.addEventListener("beforeunload", () => {
    const tempoSessao = Date.now() - inicio;
    const dadosAtuais = JSON.parse(localStorage.getItem(chave));
    const novoTempo = Math.min((dadosAtuais.tempo || 0) + tempoSessao, LIMITE_MS);
    localStorage.setItem(chave, JSON.stringify({ data: hoje, tempo: novoTempo }));
  });

  function bloquearTela() {
    document.body.innerHTML = `
      <div style="
        display:flex;flex-direction:column;justify-content:center;align-items:center;
        height:100vh;background:#000;color:#fff;font-family:sans-serif;text-align:center;">
        <h2>⏰ Tempo diário esgotado</h2>
        <p>Você assistiu 1 hora hoje.<br>Para acesso ilimitado, torne-se membro VIP.</p>
        <a href="https://sites.google.com/view/teste-helyssom/pagamento-2"
           target="_blank"
           style="background:#007bff;color:white;padding:10px 18px;border-radius:6px;
                  text-decoration:none;margin-top:15px;font-weight:bold;">
           💳 Tornar-se Membro
        </a>
      </div>
    `;
  }

  // se já atingiu o limite, bloqueia direto
  if ((dados.tempo || 0) >= LIMITE_MS) bloquearTela();
}
</script>

      padding-top: 30px;
      background: #121212;
      font-family: Arial, sans-serif;

    }

<body>

<div class="scrolling-text" id="banner">
  <span>Lista vip desativada</span>

<div class="container">

      <button id="btnListaSalva">Lista Salva</button>
      <button id="btnVip">Lista VIP</button>

      <button id="btnFavoritos">Favoritos</button>

      <div id="player"></div>
      <div class="player-controls">

        <button id="nextBtn">⏭️</button>
        <button id="exitBtn">📺 Menu</button>

<script>
  const listaSalvaUrl = 'https://raw.githubusercontent.com/Isac-Arqueiro/vip01/refs/heads/main/canais';
  const vipUrls = {
    '0001': 'https://raw.githubusercontent.com/helenfernanda/gratis/main/iptvlegal3.m3u',
    '0002': 'https://raw.githubusercontent.com/helenfernanda/gratis/main/iptvlegal4.m3u',
    '0003': 'https://raw.githubusercontent.com/helenfernanda/gratis/main/iptvlegal5.m3u'
  };
  const categoriasValidas = ['Classic', 'Series', 'Kids', 'Religioso', 'Variedade', 'Canal aberto', 'Esporte', 'Animação', 'RunTime', 'Filmes', 'News', 'URBAN'];

  let allChannels = [], currentIndex = 0, favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
  const senhaInput = document.getElementById('senhaInput');
  const senhaBtn = document.getElementById('senhaBtn');
  const senhaSection = document.getElementById('senhaSection');
  const container = document.querySelector('.container');
  const channelList = document.getElementById('channelList');
  const videoContainer = document.getElementById('videoContainer');
  const banner = document.getElementById('banner');

  senhaBtn.onclick = () => {
    const val = senhaInput.value.trim();
    if (val === '2025') {
      localStorage.setItem('iptv_password', val);
      senhaSection.style.display = 'none';
      container.style.display = 'flex';
      banner.style.display = 'block';
      setTimeout(() => banner.style.display = 'none', 30000);
      carregarLista(listaSalvaUrl);
    } else {
      alert('Senha inválida!');
    }
  };

  window.onload = () => {
    const saved = localStorage.getItem('iptv_password');
    if (saved === '2025') {
      senhaSection.style.display = 'none';
      container.style.display = 'flex';
      banner.style.display = 'block';
      setTimeout(() => banner.style.display = 'none', 30000);
      carregarLista(listaSalvaUrl);
    }
  };

  async function carregarLista(url) {
    try {
      const res = await fetch(url);
      const texto = await res.text();
      const canais = parseM3U(texto);
      allChannels = canais;
      renderChannelList(canais);
    } catch {
      alert('Erro ao carregar canais.');
    }
  }

  function parseM3U(data) {
    const lines = data.split('\n'), canais = [];
    let canal = null;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (line.startsWith('#EXTINF:')) {
        const tvg_name = (line.match(/tvg-name="([^"]+)"/) || [null, 'Sem nome'])[1];
        const tvg_logo = (line.match(/tvg-logo="([^"]+)"/) || [null, ''])[1];
        const group_title = (line.match(/group-title="([^"]+)"/) || [null, 'Outros'])[1];
        canal = { tvg_name, tvg_logo, group_title, url: '' };
      } else if (line && canal) {
        canal.url = line;
        canais.push(canal);
        canal = null;
      }
    }
    return canais;
  }

  function renderChannelList(canais) {
    channelList.innerHTML = '';
    let ultimaCategoria = '';
    canais.forEach((canal, index) => {
      if (categoriasValidas.includes(canal.group_title) && canal.group_title !== ultimaCategoria) {
        const cat = document.createElement('div');
        cat.className = 'category-label';
        cat.textContent = canal.group_title;
        channelList.appendChild(cat);
        ultimaCategoria = canal.group_title;
      }
      const div = document.createElement('div');
      div.className = 'channel';
      div.dataset.index = index;
      div.onclick = () => {
        playChannel(canal);
        currentIndex = index;
      };

      const img = document.createElement('img');
      img.src = canal.tvg_logo || 'https://via.placeholder.com/50';
      div.appendChild(img);

      const span = document.createElement('span');
      span.className = 'channel-name';
      span.textContent = canal.tvg_name;
      div.appendChild(span);

      const fav = document.createElement('button');
      fav.className = 'favorite-btn';
      fav.innerHTML = favorites.includes(canal.tvg_name) ? '★' : '☆';
      fav.classList.toggle('not-fav', !favorites.includes(canal.tvg_name));
      fav.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(canal.tvg_name, fav);
      };
      div.appendChild(fav);

      channelList.appendChild(div);
    });
  }

  function toggleFavorite(name, btn) {
    if (favorites.includes(name)) {
      favorites = favorites.filter(f => f !== name);
    } else {
      favorites.push(name);
    }
    localStorage.setItem('favorites', JSON.stringify(favorites));
    btn.innerHTML = favorites.includes(name) ? '★' : '☆';
    btn.classList.toggle('not-fav', !favorites.includes(name));
  }

  let clapprPlayer = null;

  /* 🚀 NOVA FUNÇÃO: abre Pluto TV direto no navegador */
  function playChannel(canal) {
    if (!canal.url) return;

    if (clapprPlayer) {
      clapprPlayer.destroy();
      clapprPlayer = null;
    }

    // Detecta se é link da Pluto TV
    const isPluto = canal.url.includes("pluto.tv");

    if (isPluto) {
      const confirmOpen = confirm("Este canal só pode ser aberto direto. Deseja abrir agora?");
      if (confirmOpen) {
        window.open(canal.url, "_blank");
      }
      return; // não tenta abrir no player interno
    }

    // Caso contrário, reproduz normalmente
    videoContainer.classList.add("active");
    clapprPlayer = new Clappr.Player({
      source: canal.url,
      parentId: "#player",
      autoPlay: true,
      width: "100%",
      height: "100%",
      poster: canal.tvg_logo || "",
      playback: {
        crossOrigin: "anonymous",
        hlsjsConfig: {
          xhrSetup: function (xhr, url) {
            xhr.setRequestHeader("Referer", window.location.origin);
            xhr.setRequestHeader("User-Agent", navigator.userAgent);
          },
          debug: false
        }
      }
    });

    const elem = document.getElementById("videoContainer");
    if (elem.requestFullscreen) elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
  }

  document.getElementById('exitBtn').onclick = () => {
    if (clapprPlayer) clapprPlayer.destroy();
    videoContainer.classList.remove('active');
    if (document.fullscreenElement) document.exitFullscreen();
  };

  document.getElementById('prevBtn').onclick = () => {
    currentIndex = (currentIndex - 1 + allChannels.length) % allChannels.length;
    playChannel(allChannels[currentIndex]);
  };

  document.getElementById('nextBtn').onclick = () => {
    currentIndex = (currentIndex + 1) % allChannels.length;
    playChannel(allChannels[currentIndex]);
  };

  document.getElementById('btnListaSalva').onclick = () => carregarLista(listaSalvaUrl);
  document.getElementById('btnTodos').onclick = () => renderChannelList(allChannels);
  document.getElementById('btnFavoritos').onclick = () => {
    const canaisFavoritos = allChannels.filter(c => favorites.includes(c.tvg_name));
    renderChannelList(canaisFavoritos);
  };
  document.getElementById('btnVip').onclick = () => {
    const senha = prompt('Digite a senha da lista VIP :');
    if (vipUrls[senha]) {
      carregarLista(vipUrls[senha]);
    } else {
      alert('Senha incorreta ou VIP não disponível.');
    }
  };
</script>

<button id="btnInstall" style="display:none;">📲 Instalar App</button>

<script>
let deferredPrompt;
const btnInstall = document.getElementById("btnInstall");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstall.style.display = "block";
});

btnInstall.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log("Resultado da instalação:", outcome);
    deferredPrompt = null;
    btnInstall.style.display = "none";
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .then(() => console.log("SW registrado"))
    .catch(err => console.error("Erro SW:", err));
}
</script>
