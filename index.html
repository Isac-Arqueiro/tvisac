
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site em Teste</title>

<!-- Ícones e Manifest -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="https://i.imgur.com/jFQiZvL.jpeg">
<link rel="apple-touch-icon" href="https://i.imgur.com/jFQiZvL.jpeg">
<meta name="theme-color" content="#1e90ff">

<!-- Service Worker -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("SW registrado"))
    .catch(err => console.error("Erro SW:", err));
}
</script>

<!-- Players -->
<script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.compiled.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/clappr/dash-shaka-playback/dist/dash-shaka-playback.min.js"></script>

<style>
/* ==================== Estilos do IPTV ==================== */
body { margin:0; padding-top:60px; background:#101010; font-family:Arial,sans-serif; color:#fff; overflow:hidden; }
#topBar { position:fixed; top:0; left:0; height:60px; width:100%; background:#000000aa; display:flex; align-items:center; padding:0 15px; justify-content:space-between; z-index:10000; backdrop-filter: blur(4px); font-size:15px; }
#senhaSection { height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#000; text-align:center; padding:20px; gap:15px; overflow-y:auto; }
#senhaInput { padding:12px; width:260px; text-align:center; border-radius:6px; border:none; background:#222; color:#fff; }
#senhaBtn { margin-top:10px; padding:10px 20px; background:#1e90ff; border:none; color:#fff; border-radius:6px; cursor:pointer; font-size:15px; }
.btn-neon { padding:14px 28px; font-size:17px; font-weight:bold; color:#00e5ff; background:linear-gradient(145deg,#0d0d0d,#1a1a1a); border:2px solid #00e5ff; border-radius:14px; cursor:pointer; transition:all 0.3s ease; box-shadow:0 0 12px rgba(0,229,255,0.3); text-transform:uppercase; letter-spacing:1px; margin-top:15px; }
.btn-neon:hover { background:#00e5ff; color:#121212; box-shadow:0 0 15px #00e5ff,0 0 35px #00b0ff,0 0 55px #0091ea; transform:scale(1.08); }
.container { display:none; height:100vh; flex-direction:row; }
.sidebar { width:290px; background:#0d0d0d; border-right:1px solid #222; overflow-y:auto; padding:15px; }
.top-buttons button { width:100%; padding:10px; margin-bottom:8px; background:#181818; border:1px solid #333; border-radius:8px; cursor:pointer; color:#fff; font-weight:bold; transition:0.2s; }
.top-buttons button:hover { background:#1e90ff33; border-color:#1e90ff; }
.category-label { background:linear-gradient(to right,#1e90ff55,#0000); padding:8px 10px; margin-top:10px; border-left:3px solid #1e90ff; border-radius:4px; font-size:15px; cursor:pointer; }
.channel { display:flex; align-items:center; padding:10px; margin-top:5px; border-radius:8px; cursor:pointer; transition:0.15s; background:#181818; }
.channel:hover { background:#1e1e1e; transform:translateX(4px); }
.channel img { width:50px; height:50px; margin-right:12px; border-radius:6px; border:1px solid #444; }
.favorite-btn { font-size:20px; background:none; border:none; cursor:pointer; color:gold; }
.favorite-btn.not-fav { color:#555; }
.main { flex:1; display:flex; flex-direction:column; }
#channelListRight { padding:15px; overflow-y:auto; height:100vh; background:#111; border-left:1px solid #222; }
#videoContainer { width:100%; height:100vh; background:#000; display:none; border-top:2px solid #1e90ff; position:relative; }
#videoContainer.active { display:block; }
#player { width:100%; height:100%; }
.player-controls { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:5; display:flex; gap:10px; }
.player-controls button { padding:6px 12px; border-radius:6px; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px); color:#fff; border:1px solid #333; cursor:pointer; }

/* ==================== Estilos da Segunda Interface ==================== */
#maisCanaisSection { display:none; padding:20px; overflow-y:auto; height:100vh; background:#121212; color:#fff; flex-direction:column; }
#maisCanaisSection header { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:20px; }
#maisCanaisSection header img { height:50px; }
#categoriesContainer button { margin:0 5px 10px 5px; padding:8px 15px; background-color:#2196F3; color:white; border:none; border-radius:5px; cursor:pointer; }
#categoriesContainer button:hover { background-color:#0b7dda; }
.movie-container { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
.movie-card { background-color:#1e1e1e; width:150px; border-radius:8px; overflow:hidden; text-align:center; padding-bottom:10px; }
.movie-card img { width:100%; height:220px; object-fit:cover; }
.movie-card h3 { font-size:16px; margin:10px 0; }
.movie-card a { display:inline-block; margin:5px 0; padding:5px 10px; background-color:#2196F3; color:white; text-decoration:none; border-radius:4px; }
</style>
</head>

<body>

<!-- TELA DE LOGIN -->
<div id="senhaSection">
  <div style="max-width:480px; background:#111; padding:15px; border-radius:12px; box-shadow:0 0 12px rgba(0,0,0,0.7); color:#fff; line-height:1.4; font-size:13px;">
    <h2 style="color:#1e90ff; text-align:center; margin-bottom:10px; font-size:18px;">Bem-vindo!</h2>
    <button id="testarGratisBtnLogin" class="btn-neon">Testar Grátis</button>
    <a href="https://sites.google.com/view/teste-helyssom/in%C3%ADcio" target="_blank">
      <button class="btn-neon" style="font-size:13px; padding:10px 20px; margin-top:10px;">Seja Sócio</button>
    </a>
    <button id="installPWA" class="btn-neon" style="display:none;">Instalar APP</button>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:15px;">
    <input id="senhaInput" type="password" placeholder="Digite sua senha">
    <button id="senhaBtn">Entrar</button>
  </div>
</div>

<!-- CONTAINER PRINCIPAL IPTV -->
<div class="container">
  <div class="sidebar">
    <div class="top-buttons">
      <button id="btnListaSalva">Lista Salva</button>
      <button id="btnVip">+ MAIS CANAIS</button>
      <button id="btnTodos">Todas Categorias</button>
      <button id="btnFavoritos">Favoritos</button>
    </div>
    <h2>Categorias</h2>
    <div id="channelList"></div>
  </div>
  <div class="main">
    <div id="channelListRight"></div>
    <div id="videoContainer">
      <div id="player"></div>
      <div class="player-controls">
        <button id="exitBtn">📺 Menu</button>
        <button id="prevBtn">⏮️</button>
        <button id="nextBtn">⏭️</button>
        <button id="fullscreenBtn">⛶ Tela Cheia</button>
      </div>
    </div>
  </div>
</div>

<!-- SEÇÃO MAIS CANAIS (INTEGRAÇÃO DO SEGUNDO SCRIPT) -->
<div id="maisCanaisSection">
  <header>
    <img src="https://i.imgur.com/jFQiZvL.jpeg?text=Logo" alt="Logo">
    <h2>Filmes por Categoria</h2>
  </header>
  <div class="categories" id="categoriesContainer"></div>
  <div class="movie-container" id="moviesContainer"></div>
</div>
<script>
// ==================== Variáveis IPTV ====================
const listaSalvaUrl = "https://github.com/Isac-Arqueiro/canais/raw/refs/heads/main/index.m3u8";
const categoriasValidas = ['Classic','Series','Kids','Religioso','Variedade','Canal aberto','Esporte','Animação','RunTime','Filmes','News','URBAN'];
const senhasValidas = ["2025","A0C02550","A0X02551","A0Z02552"];
let allChannels = [];
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let currentIndex = 0;

const senhaSection = document.getElementById("senhaSection");
const container = document.querySelector(".container");
const channelList = document.getElementById("channelList");
const rightList = document.getElementById("channelListRight");
const videoContainer = document.getElementById("videoContainer");
let clapprPlayer = null;

// ==================== LOGIN ====================
document.getElementById("senhaBtn").onclick = () => {
  const senha = document.getElementById("senhaInput").value;
  if (senhasValidas.includes(senha)) {
    localStorage.setItem("iptv_password", senha);
    senhaSection.style.display = "none";
    container.style.display = "flex";
    carregarLista(listaSalvaUrl);
  } else { alert("Senha incorreta!"); }
};
window.onload = () => {
  const savedSenha = localStorage.getItem("iptv_password");
  if (senhasValidas.includes(savedSenha)) {
    senhaSection.style.display = "none";
    container.style.display = "flex";
    carregarLista(listaSalvaUrl);
  }
};
document.getElementById("testarGratisBtnLogin").onclick = () => {
  document.getElementById("senhaInput").value = "2025";
  document.getElementById("senhaBtn").click();
};

// ==================== IPTV Funções ====================
async function carregarLista(url) {
  try {
    const res = await fetch(url);
    const data = await res.text();
    allChannels = parseM3U(data);
    renderCategorias();
  } catch { alert("Erro ao carregar lista."); }
}
function parseM3U(txt) {
  const linhas = txt.split("\n");
  let canais = [];
  let canal = null;
  for (let l of linhas) {
    l = l.trim();
    if (l.startsWith("#EXTINF")) {
      canal = { tvg_name: (l.match(/tvg-name="([^"]+)"/) || ["", "Sem Nome"])[1],
                tvg_logo: (l.match(/tvg-logo="([^"]+)"/) || ["", ""])[1],
                group_title: (l.match(/group-title="([^"]+)"/) || ["", "Outros"])[1],
                url: "" };
    } else if (l && canal) { canal.url = l; canais.push(canal); canal=null; }
  }
  return canais;
}
function renderCategorias() {
  channelList.innerHTML = "";
  categoriasValidas.forEach(cat => {
    const div = document.createElement("div");
    div.className = "category-label";
    div.textContent = cat;
    div.onclick = () => renderChannelList(allChannels.filter(c => c.group_title === cat));
    channelList.appendChild(div);
  });
}
function renderChannelList(canais) {
  rightList.innerHTML = "";
  canais.forEach((canal, index) => {
    const div = document.createElement("div");
    div.className = "channel";
    div.dataset.index = index;
    div.innerHTML = `<img src="${canal.tvg_logo||'https://via.placeholder.com/50'}"><span>${canal.tvg_name}</span>
                     <button class="favorite-btn ${favorites.includes(canal.tvg_name) ? "" : "not-fav"}">
                     ${favorites.includes(canal.tvg_name) ? "★" : "☆"}</button>`;
    div.querySelector("button").onclick = (e) => { e.stopPropagation(); toggleFavorite(canal.tvg_name,e.target); };
    div.onclick = () => { currentIndex=index; playChannel(canal); };
    rightList.appendChild(div);
  });
}
function toggleFavorite(name, btn) {
  if(favorites.includes(name)) favorites=favorites.filter(n=>n!==name);
  else favorites.push(name);
  localStorage.setItem("favorites", JSON.stringify(favorites));
  btn.textContent = favorites.includes(name)?"★":"☆";
  btn.classList.toggle("not-fav");
}
function playChannel(canal) {
  if(!canal.url) return;
  if(clapprPlayer) clapprPlayer.destroy();
  clapprPlayer=null;
  const box=document.getElementById("player");
  box.innerHTML="";
  videoContainer.classList.add("active");
  const isHls=canal.url.includes(".m3u8");
  const video=document.createElement("video");
  video.controls=true; video.autoplay=true; video.style.width="100%"; video.style.height="100%";
  box.appendChild(video);
  if(isHls && video.canPlayType("application/vnd.apple.mpegurl")) { video.src=canal.url; video.play(); return; }
  if(isHls && Hls.isSupported()) { const hls=new Hls(); hls.loadSource(canal.url); hls.attachMedia(video); return; }
  clapprPlayer = new Clappr.Player({ parentId:"#player", source:canal.url, autoPlay:true, width:"100%", height:"100%", playback:{playInline:true}, plugins:[DashShakaPlayback] });
}

// ==================== Controles Player ====================
document.getElementById("exitBtn").onclick = () => { if(clapprPlayer) clapprPlayer.destroy(); videoContainer.classList.remove("active"); };
document.getElementById("prevBtn").onclick = () => { currentIndex=(currentIndex-1+allChannels.length)%allChannels.length; playChannel(allChannels[currentIndex]); };
document.getElementById("nextBtn").onclick = () => { currentIndex=(currentIndex+1)%allChannels.length; playChannel(allChannels[currentIndex]); };
document.getElementById("fullscreenBtn").onclick = () => {
  const playerEl=document.getElementById("player");
  if(playerEl.requestFullscreen) playerEl.requestFullscreen();
  else if(playerEl.webkitRequestFullscreen) playerEl.webkitRequestFullscreen();
  else if(playerEl.msRequestFullscreen) playerEl.msRequestFullscreen();
};

// ==================== Menu ====================
document.getElementById("btnListaSalva").onclick = () => carregarLista(listaSalvaUrl);
document.getElementById("btnTodos").onclick = () => renderCategorias();
document.getElementById("btnVip").onclick = () => {
  // Oculta IPTV e mostra MAIS CANAIS
  container.style.display = "none";
  videoContainer.classList.remove("active");
  document.getElementById("maisCanaisSection").style.display = "flex";
};
document.getElementById("btnFavoritos").onclick = () => {
  const favChannels = allChannels.filter(c => favorites.includes(c.tvg_name));
  renderChannelList(favChannels);
};

// ==================== MAIS CANAIS ====================
const moviesByCategory = {
  "GLOBO":[
    {title:"GLOBO", cover:"https://downloadr2.apkmirror.com/wp-content/uploads/2024/11/97/67380446c88bf_com.globo.globotv-384x384.png", link:"https://globoplay.globo.com/tv-globo/ao-vivo/6120663/"},
    {title:"FUTURA", cover:"https://www.abi.org.br/wp-content/uploads/2017/03/logo-canal-futura-1.jpg", link:"https://globoplay.globo.com/ao-vivo/7420604/"},
    {title:"MALHAÇÂO", cover:"https://upload.wikimedia.org/wikipedia/pt/0/0d/Malha%C3%A7%C3%A3o_%2820%C2%AA_temporada%29.jpg", link:"https://globoplay.globo.com/ao-vivo/12136724/"},
    {title:"D.P.A", cover:"https://i.pinimg.com/736x/99/66/58/996658cce9a3fd5283c6ab9aef883b16.jpg", link:"https://globoplay.globo.com/ao-vivo/12136726/"},
    {title:"RECEITA", cover:"https://s2-receitas.glbimg.com/YrZyChoI0SfCP74ZJdv_XS_gOgo=/0x0:1920x1080/924x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_1f540e0b94d8437dbbc39d567a1dee68/internal_photos/bs/2023/l/M/4YWF3mRkelONGL29EE6A/arte.png", link:"https://globoplay.globo.com/ao-vivo/11134191/"},
{title:"", cover:"https://yt3.googleusercontent.com/ytc/AIdro_mvx_mS1li0bz-96LTmNORgWyXgKP_6XRQmU_1mesZkMg=s900-c-k-c0x00ffffff-no-rj", link:""},
{title:"", cover:"https://yt3.googleusercontent.com/ytc/AIdro_mvx_mS1li0bz-96LTmNORgWyXgKP_6XRQmU_1mesZkMg=s900-c-k-c0x00ffffff-no-rj", link:""},
{title:"", cover:"https://yt3.googleusercontent.com/ytc/AIdro_mvx_mS1li0bz-96LTmNORgWyXgKP_6XRQmU_1mesZkMg=s900-c-k-c0x00ffffff-no-rj", link:""},
    {title:"", cover:"https://yt3.googleusercontent.com/ytc/AIdro_mvx_mS1li0bz-96LTmNORgWyXgKP_6XRQmU_1mesZkMg=s900-c-k-c0x00ffffff-no-rj", link:""},
    {title:"", cover:"https://yt3.googleusercontent.com/ytc/AIdro_mvx_mS1li0bz-96LTmNORgWyXgKP_6XRQmU_1mesZkMg=s900-c-k-c0x00ffffff-no-rj", link:""}
],
  "ESPORTE":[
    {title:"SPORTV", cover:"https://designconceitual.com.br/wp-content/uploads/2017/08/SPORTV.png", link:"https://globoplay.globo.com/ao-vivo/7689934/"},
    {title:"SPORT 2", cover:"https://designconceitual.com.br/wp-content/uploads/2017/08/SPORTV.png", link:"https://globoplay.globo.com/ao-vivo/7690141/"},
    {title:"GeTV", cover:"https://set.org.br/wp-content/uploads/2025/09/GE-TV-logo.jpg", link:"https://globoplay.globo.com/ao-vivo/11134179/"},
    {title:"SFT", cover:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSC8mi_K5DiK57Av_ykPfM5-ImPS1UNCa6qQw&s", link:"https://hrm-sftc.otteravision.com/hrm/sftc/sftc_720p_high.m3u8"},
    {title:"CAZÉ TV", cover:"https://www.claro.com.br/files/104379/860x1440/9da5b62119/capa-assistir-caze-tv-online.png/m/filters:quality(75)", link:"https://amg01391-amg01391c10-tcl-br-9630.playouts.now.amagi.tv/1080p-cc/index.m3u8"},
    {title:"GLOBO", cover:"https://downloadr2.apkmirror.com/wp-content/uploads/2024/11/97/67380446c88bf_com.globo.globotv-384x384.png", link:"https://globoplay.globo.com/tv-globo/ao-vivo/6120663/"},
    {title:"", cover:"https://yt3.googleusercontent.com/ytc/AIdro_mvx_mS1li0bz-96LTmNORgWyXgKP_6XRQmU_1mesZkMg=s900-c-k-c0x00ffffff-no-rj", link:""},
    {title:"", cover:"https://yt3.googleusercontent.com/ytc/AIdro_mvx_mS1li0bz-96LTmNORgWyXgKP_6XRQmU_1mesZkMg=s900-c-k-c0x00ffffff-no-rj", link:""},
    {title:"", cover:"https://yt3.googleusercontent.com/ytc/AIdro_mvx_mS1li0bz-96LTmNORgWyXgKP_6XRQmU_1mesZkMg=s900-c-k-c0x00ffffff-no-rj", link:""},
    {title:"", cover:"https://yt3.googleusercontent.com/ytc/AIdro_mvx_mS1li0bz-96LTmNORgWyXgKP_6XRQmU_1mesZkMg=s900-c-k-c0x00ffffff-no-rj", link:""}
  ]
};
// Renderiza botões de categorias
const categoriesContainer = document.getElementById("categoriesContainer");
const moviesContainer = document.getElementById("moviesContainer");

Object.keys(moviesByCategory).forEach(cat => {
  const btn = document.createElement("button");
  btn.textContent = cat;
  btn.onclick = () => renderMovies(cat);
  categoriesContainer.appendChild(btn);
});

function renderMovies(category) {
  moviesContainer.innerHTML = "";
  if(!moviesByCategory[category]) return;
  moviesByCategory[category].forEach(movie => {
    const card = document.createElement("div");
    card.className = "movie-card";
    card.innerHTML = `
      <img src="${movie.cover}" alt="${movie.title}">
      <h3>${movie.title}</h3>
      <a href="${movie.link}" target="_blank">Assistir</a>
    `;
    moviesContainer.appendChild(card);
  });
}

// Botão para voltar do MAIS CANAIS ao IPTV
const voltarBtn = document.createElement("button");
voltarBtn.textContent = "← Voltar";
voltarBtn.style.margin = "10px 0";
voltarBtn.onclick = () => {
  document.getElementById("maisCanaisSection").style.display = "none";
  container.style.display = "flex";
};
categoriesContainer.prepend(voltarBtn);
</script>
</body>
</html>
