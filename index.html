<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player</title>
  <link rel="icon" href="https://i.imgur.com/jFQiZvL.jpeg">

  <!-- Clappr + HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.compiled.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/clappr/dash-shaka-playback/dist/dash-shaka-playback.min.js"></script>

  <!-- SERVICE WORKER (estava dentro do <style>, erro corrigido) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("Service Worker registrado!"))
          .catch(err => console.log("Erro SW:", err));
      });
    }
  </script>

  <style>
    body { margin:0; padding-top:60px; background:#101010; font-family:Arial,sans-serif; color:#fff; overflow:hidden; }
    #topBar { position:fixed; top:0; left:0; height:60px; width:100%; background:#000000aa; display:flex; align-items:center; padding:0 15px; justify-content:space-between; z-index:10000; backdrop-filter: blur(4px); font-size:15px; }
    #senhaSection { height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#000; text-align:center; padding:20px; gap:15px; overflow-y:auto; }
    #senhaInput { padding:12px; width:260px; text-align:center; border-radius:6px; border:none; background:#222; color:#fff; }
    #senhaBtn, .btn-neon { padding:10px 20px; background:#1e90ff; border:none; color:#fff; border-radius:6px; cursor:pointer; font-size:15px; }
    .btn-neon { font-weight:bold; margin-top:10px; }
    .container { display:none; height:100vh; flex-direction:row; }
    .sidebar { width:290px; background:#0d0d0d; border-right:1px solid #222; overflow-y:auto; padding:15px; }
    .top-buttons button { width:100%; padding:10px; margin-bottom:8px; background:#181818; border:1px solid #333; border-radius:8px; cursor:pointer; color:#fff; font-weight:bold; transition:0.2s; }
    .top-buttons button:hover { background:#1e90ff33; border-color:#1e90ff; }
    h2 { margin-top:15px; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:6px; }
    .category-label { background:linear-gradient(to right,#1e90ff55,#0000); padding:6px 8px; margin-top:10px; border-left:3px solid #1e90ff; border-radius:4px; font-size:14px; }
    .channel { display:flex; align-items:center; padding:10px; margin-top:5px; border-radius:8px; cursor:pointer; transition:0.15s; }
    .channel:hover { background:#1e1e1e; transform:translateX(4px); }
    .channel img { width:50px; height:50px; margin-right:12px; border-radius:6px; border:1px solid #444; }
    .channel-name { flex:1; font-size:15px; }
    .favorite-btn { font-size:20px; background:none; border:none; cursor:pointer; color:gold; }
    .favorite-btn.not-fav { color:#555; }
    .main { flex:1; }
    #videoContainer { width:100%; height:100vh; background:#000; display:none; border-left:2px solid #1e90ff; }
    #videoContainer.active { display:block; }
    #player { width:100%; height:100%; }
    .player-controls { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:5; display:flex; gap:10px; }
    .player-controls button { padding:6px 12px; border-radius:6px; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px); color:#fff; border:1px solid #333; cursor:pointer; }
  </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="senhaSection">
  <div style="max-width:480px; background:#111; padding:15px; border-radius:12px; box-shadow:0 0 12px rgba(0,0,0,0.7); color:#fff; font-family:Arial,sans-serif; line-height:1.4; font-size:13px;">
    <h2 style="color:#1e90ff; text-align:center; margin-bottom:10px; font-size:18px;">Bem-vindo!</h2>
    <p>Aqui você encontra uma seleção <strong>exclusiva de canais abertos</strong>, escolhidos com cuidado.</p>
    <p>Aproveite os canais, navegue à vontade e, se puder, apoie o projeto.</p>
    <button id="testarGratisBtnLogin" class="btn-neon">Testar Grátis</button>
    <a href="https://sites.google.com/view/teste-helyssom/in%C3%ADcio" target="_blank">
      <button class="btn-neon" style="font-size:13px; padding:10px 20px; margin-top:10px;">Seja Sócio</button>
    </a>
  </div>

  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:15px;">
    <input id="senhaInput" type="password" placeholder="Digite sua senha">
    <button id="senhaBtn">Entrar</button>
  </div>
</div>

<!-- CONTAINER PRINCIPAL -->
<div class="container">
  <div class="sidebar">
    <div class="top-buttons">
      <button id="btnListaSalva">Lista Salva</button>
      <button id="btnVip">+ MAIS CANAIS</button>
      <button id="btnTodos">Todos</button>
      <button id="btnFavoritos">Favoritos</button>
    </div>
    <h2>CANAIS</h2>
    <div id="channelList"></div>
  </div>

  <div class="main">
    <div id="videoContainer">
      <div id="player"></div>
      <div class="player-controls">
        <button id="prevBtn">⏮️</button>
        <button id="nextBtn">⏭️</button>
        <button id="exitBtn">📺 Menu</button>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPTS DO PLAYER -->
<script>
const listaSalvaUrl = "https://raw.githubusercontent.com/Isac-Arqueiro/vip01/refs/heads/main/canais";
const categoriasValidas = ['Classic','Series','Kids','Religioso','Variedade','Canal aberto','Esporte','Animação','RunTime','Filmes','News','URBAN'];
const senhasValidas = ["2025","A0C02550","A0X02551","A0Z02552"];

let allChannels = [];
let currentIndex = 0;
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let clapprPlayer = null;

/* LOGIN */
const senhaSection = document.getElementById("senhaSection");
const container = document.querySelector(".container");

function entrar(senha) {
  if (!senhasValidas.includes(senha)) { alert("Senha incorreta!"); return; }

  localStorage.setItem("iptv_password", senha);
  senhaSection.style.display = "none";
  container.style.display = "flex";

  document.getElementById("testarGratisBtnLogin").style.display = senha === "2025" ? "inline-block" : "none";

  carregarLista(listaSalvaUrl);
}

document.getElementById("senhaBtn").onclick = () => entrar(document.getElementById("senhaInput").value);
document.getElementById("testarGratisBtnLogin").onclick = () => entrar("2025");

window.onload = () => {
  const savedSenha = localStorage.getItem("iptv_password");
  if (senhasValidas.includes(savedSenha)) entrar(savedSenha);
};

/* CARREGAR LISTA */
async function carregarLista(url) {
  try {
    const res = await fetch(url);
    const data = await res.text();
    allChannels = parseM3U(data);
    renderChannelList(allChannels);
  } catch {
    alert("Erro ao carregar lista.");
  }
}

function parseM3U(txt) {
  const linhas = txt.split("\n");
  let canais = [], canal = null;
  for (let l of linhas) {
    l = l.trim();
    if (l.startsWith("#EXTINF")) {
      canal = {
        tvg_name: (l.match(/tvg-name="([^"]+)"/) || ["","Sem Nome"])[1],
        tvg_logo: (l.match(/tvg-logo="([^"]+)"/) || ["",""])[1],
        group_title: (l.match(/group-title="([^"]+)"/) || ["","Outros"])[1],
        url: ""
      };
    } else if (l && canal) { canal.url = l; canais.push(canal); canal=null; }
  }
  return canais;
}

function renderChannelList(canais) {
  const channelList = document.getElementById("channelList");
  channelList.innerHTML = "";
  let ultimaCategoria = "";

  canais.forEach((canal, index) => {
    if (categoriasValidas.includes(canal.group_title) && canal.group_title !== ultimaCategoria) {
      const cat = document.createElement("div");
      cat.className = "category-label";
      cat.textContent = canal.group_title;
      channelList.appendChild(cat);
      ultimaCategoria = canal.group_title;
    }

    const div = document.createElement("div");
    div.className = "channel";
    div.dataset.index = index;
    div.onclick = () => { currentIndex = index; playChannel(canal); };

    div.innerHTML = `
      <img src="${canal.tvg_logo||'https://via.placeholder.com/50'}">
      <span class="channel-name">${canal.tvg_name}</span>
      <button class="favorite-btn ${favorites.includes(canal.tvg_name) ? "" : "not-fav"}">
        ${favorites.includes(canal.tvg_name) ? "★" : "☆"}
      </button>
    `;

    div.querySelector("button").onclick = (e) => {
      e.stopPropagation();
      toggleFavorite(canal.tvg_name, e.target);
    };

    channelList.appendChild(div);
  });
}

function toggleFavorite(name, btn) {
  favorites = favorites.includes(name) ? favorites.filter(n => n !== name) : [...favorites, name];
  localStorage.setItem("favorites", JSON.stringify(favorites));
  btn.textContent = favorites.includes(name) ? "★" : "☆";
  btn.classList.toggle("not-fav");
}

/* PLAYER */
const videoContainer = document.getElementById("videoContainer");

function playChannel(canal) {
  if (!canal.url) return;
  if (clapprPlayer) clapprPlayer.destroy();
  clapprPlayer = null;

  const box = document.getElementById("player");
  box.innerHTML = "";
  videoContainer.classList.add("active");

  const video = document.createElement("video");
  video.controls = true;
  video.autoplay = true;
  video.style.width = "100%";
  video.style.height = "100%";
  video.style.background = "black";
  box.appendChild(video);

  if (canal.url.includes(".m3u8")) {
    if (video.canPlayType("application/vnd.apple.mpegurl")) { video.src = canal.url; video.play(); return; }
    if (Hls.isSupported()) { const hls = new Hls(); hls.loadSource(canal.url); hls.attachMedia(video); return; }
  }

  clapprPlayer = new Clappr.Player({
    parentId:"#player",
    source: canal.url,
    autoPlay:true,
    width:"100%",
    height:"100%",
    playback:{ playInline:true },
    plugins:[DashShakaPlayback],
    shakaConfiguration:{ streaming:{ lowLatencyMode:true } }
  });
}

/* CONTROLES */
document.getElementById("exitBtn").onclick = () => { if(clapprPlayer) clapprPlayer.destroy(); videoContainer.classList.remove("active"); };
document.getElementById("prevBtn").onclick = () => { currentIndex = (currentIndex -1 + allChannels.length)%allChannels.length; playChannel(allChannels[currentIndex]); };
document.getElementById("nextBtn").onclick = () => { currentIndex = (currentIndex +1)%allChannels.length; playChannel(allChannels[currentIndex]); };

/* MENU */
document.getElementById("btnListaSalva").onclick = () => carregarLista(listaSalvaUrl);
document.getElementById("btnTodos").onclick = () => renderChannelList(allChannels);
document.getElementById("btnVip").onclick = () => window.open("https://isac-arqueiro.github.io/isacvod/","_blank");
document.getElementById("btnFavoritos").onclick = () => renderChannelList(allChannels.filter(c => favorites.includes(c.tvg_name)));
</script>

<!-- LOGO NO LOGIN -->
<script>
  const titulo = document.querySelector("#senhaSection h2");
  if(titulo){
    const img = document.createElement("img");
    img.src = "https://i.imgur.com/jFQiZvL.jpeg";
    img.alt = "Logo";
    img.style.width = "100px";
    img.style.height = "100px";
    img.style.borderRadius = "50%";
    img.style.objectFit = "cover";
    img.style.display = "block";
    img.style.margin = "0 auto 10px auto";
    titulo.parentNode.insertBefore(img, titulo);
  }
</script>

</body>
</html>
